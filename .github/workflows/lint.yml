name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: HTMLHint
        run: npx --yes htmlhint "html/**/*.html"
      - name: Stylelint (syntax only)
        # No shared config: this only catches actual CSS syntax errors, not
        # style-guide preferences (stylelint-config-standard flagged 184
        # cosmetic issues against hand-authored CSS predating the linter —
        # not worth a wholesale rewrite of someone's site styling).
        run: |
          npm install --no-save stylelint
          echo '{"rules":{}}' > /tmp/stylelint.empty.json
          npx stylelint "html/**/*.css" --config /tmp/stylelint.empty.json

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Validate nginx.conf syntax
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/html:/usr/share/nginx/html:ro" \
            nginx:alpine nginx -t
