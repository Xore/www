server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # HTML must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS use stable filenames (style.css, app.js) — do NOT mark them
    # immutable, or overwriting a deploy leaves clients stuck on old bytes
    # for a year. "no-cache" = cache but revalidate (cheap 304 via ETag),
    # so redeploys show up immediately.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Media/fonts rarely change and can be cached long-term.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;
}
